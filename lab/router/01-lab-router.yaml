# Netplan config for lab-router. Copy to /etc/netplan/01-lab-router.yaml, then: sudo netplan apply
# VirtualBox NIC1..NIC4 appear in Ubuntu as enp0s3, enp0s8, enp0s9, enp0s10.
network:
  version: 2
  ethernets:
    enp0s3:            # NIC1 -> lab-user-lan
      addresses: [10.10.10.1/24]
    enp0s8:            # NIC2 -> lab-dmz
      addresses: [10.10.20.1/24]
    enp0s9:            # NIC3 -> lab-internal
      addresses: [10.10.30.1/24]
    enp0s10:           # NIC4 -> NAT, only for installing packages; disconnect afterwards
      dhcp4: true
      optional: true
